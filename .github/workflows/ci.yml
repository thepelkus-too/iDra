name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: hydra-motion build is reproducible and committed (packages/motion/dist, registry entry)
        run: |
          npm run build -w hydra-motion
          node scripts/sync-motion.mjs --check
          git diff --exit-code -- packages/motion/dist packages/core/plugins/registry.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - name: e2e (Chromium, software WebGL)
        run: |
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs --skip-build
      - name: e2e audio, plugins, MIDI (Chromium, fake devices, local servers)
        run: node scripts/e2e-audio-plugins.mjs --skip-build
      - name: e2e hydra-motion (Motion lab with two touch points, vanilla Hydra compatibility, offline)
        run: node scripts/e2e-motion.mjs --skip-build
      - name: iPad-viewport screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-e2e
          path: test-results/ipad
          if-no-files-found: ignore
